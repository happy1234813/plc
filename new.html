<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLC 8路指示灯模拟</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #1a1a1a;
            color: white;
            padding: 50px;
        }
        h2 {
            margin-bottom: 30px;
        }
        .light-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .light {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #999;
            background: #555;
            transition: all 0.3s;
        }
        .light.on:nth-child(1) { background: #ff0000; box-shadow: 0 0 15px #ff0000; }
        .light.on:nth-child(2) { background: #ffaa00; box-shadow: 0 0 15px #ffaa00; }
        .light.on:nth-child(3) { background: #00ff00; box-shadow: 0 0 15px #00ff00; }
        .light.on:nth-child(4) { background: #00aaff; box-shadow: 0 0 15px #00aaff; }
        .light.on:nth-child(5) { background: #ff00aa; box-shadow: 0 0 15px #ff00aa; }
        .light.on:nth-child(6) { background: #ffff00; box-shadow: 0 0 15px #ffff00; }
        .light.on:nth-child(7) { background: #00ffff; box-shadow: 0 0 15px #00ffff; }
        .light.on:nth-child(8) { background: #aa00ff; box-shadow: 0 0 15px #aa00ff; }
        .btn-group{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap:15px;
            margin-bottom:20px;
        }
        button{
            width:80px;
            height:50px;
            font-size:18px;
        }
        #resetBtn{
            background-color:red;
            color:white;
            border:none;
            border-radius:6px;
        }
    </style>
</head>
<body>
    <h2>PLC 8路指示灯模拟</h2>
    <div class="light-group">
        <div class="light" id="L1"></div>
        <div class="light" id="L2"></div>
        <div class="light" id="L3"></div>
        <div class="light" id="L4"></div>
        <div class="light" id="L5"></div>
        <div class="light" id="L6"></div>
        <div class="light" id="L7"></div>
        <div class="light" id="L8"></div>
    </div>
    <div class="btn-group">
        <button onclick="selectLight(1)">灯1</button>
        <button onclick="selectLight(2)">灯2</button>
        <button onclick="selectLight(3)">灯3</button>
        <button onclick="selectLight(4)">灯4</button>
        <button onclick="selectLight(5)">灯5</button>
        <button onclick="selectLight(6)">灯6</button>
        <button onclick="selectLight(7)">灯7</button>
        <button onclick="selectLight(8)">灯8</button>
    </div>
    <button id="resetBtn" onclick="resetAll()">全部复位</button>

<script>
//选中某一盏灯，其他灯全部熄灭（互锁）
function selectLight(num){
    //全部灯先关掉
    let allLights = document.querySelectorAll(".light");
    allLights.forEach(item=>{
        item.classList.remove("on");
    })
    //点亮当前选择的灯
    document.getElementById("L"+num).classList.add("on");
}
//复位函数：所有灯熄灭
function resetAll(){
    let allLights = document.querySelectorAll(".light");
    allLights.forEach(item=>{
        item.classList.remove("on");
    })
}
</script>
</body>
</html>
